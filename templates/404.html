<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>404 — InstaBatch Downloader</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#efefef;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .num{font-size:6rem;font-weight:900;background:linear-gradient(135deg,#f09433,#dc2743,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
    p{color:#777;margin:16px 0 28px;font-size:.95rem}
    a{color:#a855f7;text-decoration:none;font-weight:700;border:1px solid rgba(168,85,247,.4);padding:10px 24px;border-radius:24px;transition:all .2s}
    a:hover{background:rgba(168,85,247,.15)}
  </style>
</head>
<body>
  <div>
    <div class="num">404</div>
    <p>Page not found or access denied.</p>
    <a href="/">← Go Home</a>

</body>
