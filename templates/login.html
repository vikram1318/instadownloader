<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — InstaBatch Downloader</title>
  <style>
    :root{--bg:#0a0a0a;--surface:#141414;--border:#2e2e2e;--text:#efefef;--muted:#777;--purple:#a855f7;--red:#ef4444;--grad:linear-gradient(135deg,#f09433,#dc2743,#bc1888)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
    .logo svg{width:40px;height:40px;flex-shrink:0}
    .logo h1{font-size:1.2rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo p{font-size:.72rem;color:var(--muted);margin-top:2px}
    label{display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:8px}
    input[type=password]{width:100%;background:#1e1e1e;border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:.95rem;padding:12px 14px;outline:none;transition:border-color .2s}
    input[type=password]:focus{border-color:var(--purple)}
    button{width:100%;margin-top:20px;padding:13px;border:none;border-radius:9px;font-size:1rem;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#f09433,#dc2743,#bc1888);color:#fff;letter-spacing:.03em;transition:opacity .2s,transform .15s;box-shadow:0 4px 18px rgba(188,24,136,.3)}
    button:hover{opacity:.9;transform:translateY(-1px)}
    button:active{transform:translateY(0)}
    .error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);padding:10px 14px;border-radius:8px;font-size:.82rem;margin-bottom:18px}
    .lock{font-size:2rem;text-align:center;margin-bottom:20px}
  </style>
</head>
<body>
  <div class="card">
    <div class="lock">🔐</div>
    <div class="logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="ig" x1="0" y1="40" x2="40" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f09433"/><stop offset="50%" stop-color="#dc2743"/><stop offset="100%" stop-color="#bc1888"/></linearGradient></defs>
        <rect width="40" height="40" rx="11" fill="url(#ig)"/>
        <rect x="10" y="10" width="20" height="20" rx="5" stroke="white" stroke-width="2.2" fill="none"/>
        <circle cx="20" cy="20" r="5" stroke="white" stroke-width="2.2" fill="none"/>
        <circle cx="27.5" cy="12.5" r="1.6" fill="white"/>
      </svg>
      <div>
        <h1>InstaBatch Downloader</h1>
        <p>Enter your password to continue</p>
      </div>
    </div>

    {% if error %}
    <div class="error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password…" autofocus autocomplete="current-password"/>
      <button type="submit">Unlock →</button>
    </form>
  </div>
</body>
</html>
